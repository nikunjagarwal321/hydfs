syntax = "proto3";

package proto;

option go_package = "proto/"; // replace `yourmodule` with your Go module name

service HyDFSService {
  // Client streams file chunks to the server
  rpc FileTransfer(stream FileChunk) returns (UploadStatus);
}

message FileChunk {
  string filename = 1;
  bytes data = 2;
}

message UploadStatus {
  bool success = 1;
  string message = 2;
}
